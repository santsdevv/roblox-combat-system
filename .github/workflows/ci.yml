name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - name: StyLua
        run: stylua --check src
      - name: Selene
        run: selene src
      - name: Rojo build
        run: rojo build default.project.json -o build.rbxl
